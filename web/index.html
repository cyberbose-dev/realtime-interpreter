<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>同時通訳</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="login" class="screen" hidden>
      <div class="login-card">
        <h1>同時通訳</h1>
        <p>Amazon Transcribe・Bedrock・Polly によるリアルタイム通訳</p>
        <button id="login-btn" class="primary">ログイン / 新規登録</button>
      </div>
    </div>

    <div id="app" class="screen" hidden>
      <header>
        <span id="status" class="status" data-state="idle"><span class="dot"></span><span id="status-text">待機中</span></span>
        <button id="direction" class="direction" title="翻訳の向きを切り替え">
          <span id="dir-from"></span><span class="arrow">→</span><span id="dir-to"></span><span class="swap">⇄</span>
        </button>
        <button id="toggle-original" class="icon-btn" aria-pressed="false" title="原文を表示">原文</button>
        <button id="open-settings" class="icon-btn" title="設定" aria-label="設定">⚙</button>
      </header>

      <main id="panes">
        <section id="original" class="pane" aria-label="原文"></section>
        <section id="translation" class="pane" aria-label="翻訳"></section>
      </main>

      <footer>
        <div id="notice" class="notice" role="status"></div>
        <div class="controls">
          <div class="meter" aria-hidden="true"><div id="meter-bar"></div></div>
          <button id="start" class="primary start">開始</button>
        </div>
        <p class="hint">確定した翻訳文を長押しすると読み上げます</p>
      </footer>
    </div>

    <dialog id="settings">
      <form method="dialog" id="settings-form">
        <h2>設定</h2>
        <label>自分の言語<select name="langA"></select></label>
        <label>相手の言語<select name="langB"></select></label>
        <fieldset>
          <legend>翻訳の向き</legend>
          <label class="inline"><input type="radio" name="direction" value="BtoA" /> <span id="dir-label-BtoA"></span></label>
          <label class="inline"><input type="radio" name="direction" value="AtoB" /> <span id="dir-label-AtoB"></span></label>
        </fieldset>
        <label id="source-field">音声入力
          <select name="source">
            <option value="mix">マイク＋PC の音声</option>
            <option value="mic">マイクのみ</option>
            <option value="system">PC の音声のみ</option>
          </select>
          <small>PC の音声は画面共有のダイアログで「音声を共有」をオンにしてください。タブの共有が最も確実です。</small>
        </label>
        <label class="inline"><input type="checkbox" name="draft" /> 確定前の翻訳を表示する（Nova 2 Lite）</label>
        <label>文字サイズ
          <select name="fontSize">
            <option value="s">小</option>
            <option value="m">中</option>
            <option value="l">大</option>
            <option value="xl">特大</option>
          </select>
        </label>
        <label>翻訳の前提（コンテキスト）
          <textarea name="context" rows="5" maxlength="2000"></textarea>
        </label>
        <div class="row">
          <button type="button" id="reset-context">前提を初期値に戻す</button>
          <button type="button" id="clear">表示をクリア</button>
          <button type="button" id="logout">ログアウト</button>
        </div>
        <p class="small">設定はこのタブを開いている間だけ有効です。</p>
        <div class="row end"><button value="close" class="primary">閉じる</button></div>
      </form>
    </dialog>
  </body>
</html>
